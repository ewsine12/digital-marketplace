
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Digital Marketplace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Digital Marketplace</h1>
    </header>

    <!-- Login / Signup -->
    <section id="auth">
        <h2>Login / Signup</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="email" id="email" placeholder="Email (Signup)">
        <input type="password" id="password" placeholder="Password">
        <button onclick="signup()">Sign Up</button>
        <button onclick="login()">Login</button>
    </section>

    <!-- User Dashboard -->
    <section id="user-dashboard" style="display:none;">
        <h2>Welcome <span id="user-name"></span></h2>
        <p>Balance: $<span id="user-balance"></span></p>
        <h3>Products</h3>
        <div id="products"></div>
    </section>

    <!-- Admin Dashboard -->
    <section id="admin-dashboard" style="display:none;">
        <h2>Admin Panel</h2>
        <button onclick="loadUsers()">View Users</button>
        <button onclick="loadOrders()">View Orders</button>
        <button onclick="addProductForm()">Add Product</button>
        <div id="admin-content"></div>
    </section>

    <footer>
        <p>Contact: Telegram / WhatsApp</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
